<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bambu Filament Scanner</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 16px;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
      }
      video, canvas {
        width: 100%;
        border-radius: 12px;
        background: #000;
      }
      button {
        padding: 10px 16px;
        border-radius: 10px;
        border: 0;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Mobile Scanner</h2>
      <p>Scan QR on a spool and sync to desktop.</p>
      <label for="endpoint">Desktop endpoint</label>
      <input id="endpoint" placeholder="http://192.168.1.10:4278/api/scan" />
      <div style="margin-top: 12px; display: flex; gap: 12px;">
        <button id="connect">Connect</button>
        <button id="snapshot">Capture</button>
      </div>
      <p id="status">Disconnected</p>
    </div>
    <div class="card">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    </div>
    <script type="module" src="./scanner.ts"></script>
  </body>
</html>
