[package]
name = "filament-manager-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
test-support = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rand = "0.10.2"
time = { version = "0.3.53", features = ["parsing"] }

[workspace]
members = ["src-tauri"]
default-members = [".", "src-tauri"]
resolver = "2"
