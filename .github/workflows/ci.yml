name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-smoke:
    name: macOS Smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install chromium

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run full verification
        run: npm run verify

      - name: Run data-backed Companion E2E
        timeout-minutes: 10
        run: npm run qa:visual:companion:data-e2e -- --startup-timeout-ms 120000

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Run static path portability contract
        run: npm run check:path-portability

      - name: Run static command portability contract
        run: npm run check:command-portability

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install chromium

      - name: Run portability checks
        run: npm run test:portability

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run full verification
        run: npm run verify

      - name: Prepare MSI smoke version override
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-smoke-version.json
        run: node ./scripts/normalize-msi-version.mjs --output "$env:MSI_VERSION_CONFIG_PATH"

      - name: Build MSI smoke bundle
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-smoke-version.json
        run: npm run tauri -- build --debug --bundles msi --config "$env:MSI_VERSION_CONFIG_PATH"

      - name: Verify MSI smoke bundle
        shell: pwsh
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-smoke-version.json
        run: |
          $tauriConfig = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $msiVersionConfig = Get-Content -LiteralPath $env:MSI_VERSION_CONFIG_PATH -Raw | ConvertFrom-Json
          ./scripts/verify-windows-msi.ps1 `
            -MsiDirectory "target/debug/bundle/msi" `
            -ExpectedProductName $tauriConfig.productName `
            -ExpectedProductVersion $msiVersionConfig.bundle.windows.wix.version `
            -ExpectedArchitecture "x64" `
            -NormalizedFileName "Filament-Manager_$($tauriConfig.version)_x64_en-US.msi"

      - name: Exercise clean MSI installation
        shell: pwsh
        env:
          WINDOWS_MSI_SMOKE_LOG_DIR: ${{ runner.temp }}/filament-manager-windows-msi-smoke
        run: |
          $tauriConfig = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $msiFiles = @(Get-ChildItem -LiteralPath "target/debug/bundle/msi" -Filter "*.msi" -File)
          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one verified debug MSI; found $($msiFiles.Count)."
          }

          ./scripts/smoke-windows-msi.ps1 `
            -MsiPath $msiFiles[0].FullName `
            -ExpectedProductName $tauriConfig.productName `
            -ExpectedExecutableName "bambu-filament-manager.exe" `
            -ExpectedWindowTitles @($tauriConfig.productName, "Dashboard") `
            -ExpectedInstallDirectory (Join-Path $env:LOCALAPPDATA $tauriConfig.productName) `
            -ExpectedAppDataDirectory (Join-Path $env:LOCALAPPDATA $tauriConfig.identifier) `
            -ExpectedDatabaseName "filament-manager.db" `
            -LogDirectory $env:WINDOWS_MSI_SMOKE_LOG_DIR `
            -SignaturePolicy "UnsignedRequired" `
            -LaunchTimeoutSeconds 90

      - name: Upload MSI smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-windows-msi-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/filament-manager-windows-msi-smoke
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
