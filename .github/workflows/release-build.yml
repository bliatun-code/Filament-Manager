name: Release Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ./ui ci

      - name: Build DMG bundle
        run: npm run tauri -- build --bundles dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: filament-manager-macos-dmg-${{ github.ref_name }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ./ui ci

      - name: Build MSI bundle
        run: npm run tauri -- build --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: filament-manager-windows-msi-${{ github.ref_name }}
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
