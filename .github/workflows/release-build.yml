name: Release Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Select which installer artifacts to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - macos
      confirm_macos_notarization:
        description: "Allow a manual macOS build to upload to Apple for notarization"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps['release-request'].outputs['package-version'] }}
      release-tag: ${{ steps['release-request'].outputs['release-tag'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate version and release source
        id: release-request
        env:
          CONFIRM_MACOS_NOTARIZATION: ${{ inputs.confirm_macos_notarization }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          npm run check:version
          npm run check:path-portability
          npm run check:command-portability
          node --test ./scripts/release-workflow-contract.test.mjs

          package_version="$(node -p "require('./package.json').version")"
          release_tag="v$package_version"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
            && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual release builds must run from the main branch."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" \
            && (
              "$GITHUB_REF_TYPE" != "tag" \
              || "$GITHUB_REF_NAME" != "$release_tag" \
              || "$GITHUB_REF" != "refs/tags/$release_tag"
            ) ]]; then
            echo "::error::Release publishing is restricted to the exact version tag refs/tags/$release_tag."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" \
            || "$SELECTED_PLATFORM" == "windows" \
            || "$SELECTED_PLATFORM" == "both" ]]; then
            npm run check:msi-version
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
            && "$SELECTED_PLATFORM" != "windows" \
            && "$CONFIRM_MACOS_NOTARIZATION" != "true" ]]; then
            echo "::error::Manual macOS release builds require notarization confirmation."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$release_tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package version $release_tag."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Release tag $GITHUB_REF_NAME must point to a commit on main."
              exit 1
            fi
          fi

  build-macos-dmg:
    name: Build signed macOS DMG
    needs: validate-release
    if: github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'macos'
    environment: macos-release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Configure temporary release paths
        run: |
          set -euo pipefail
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/filament-manager-target"
            echo "FILAMENT_MANAGER_CERTIFICATE_PATH=$RUNNER_TEMP/developer-id-application.p12"
            echo "FILAMENT_MANAGER_KEYCHAIN_PATH=$RUNNER_TEMP/filament-manager-signing.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Record build environment
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ./ui ci

      - name: Validate release version
        run: |
          set -euo pipefail
          npm run check:version
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$package_version."
            exit 1
          fi

      - name: Prepare Apple credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          required_secrets=(
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_PRIVATE_KEY
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
          )
          for name in "${required_secrets[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required macos-release secret: $name"
              exit 1
            fi
          done

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$FILAMENT_MANAGER_CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$FILAMENT_MANAGER_CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security import "$FILAMENT_MANAGER_CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security list-keychains -d user -s "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security default-keychain -d user -s "$FILAMENT_MANAGER_KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$FILAMENT_MANAGER_KEYCHAIN_PATH" \
            | grep -Fq "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::The configured Developer ID Application identity was not imported."
            exit 1
          fi

      - name: Build signed and notarized DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FILAMENT_MANAGER_UPDATE_METADATA_URL: ${{ vars.FILAMENT_MANAGER_UPDATE_METADATA_URL }}
          FILAMENT_MANAGER_REQUIRE_MACOS_SIGNING: "1"
        run: npm run tauri -- build --bundles dmg

      - name: Normalize DMG filename
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$CARGO_TARGET_DIR"/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one signed DMG, found ${#dmgs[@]}."
            exit 1
          fi

          original_path="${dmgs[0]}"
          original_name="$(basename "$original_path")"
          normalized_name="${original_name// /-}"
          normalized_path="$(dirname "$original_path")/$normalized_name"
          if [[ "$original_path" != "$normalized_path" ]]; then
            mv "$original_path" "$normalized_path"
          fi
          echo "FILAMENT_MANAGER_DMG_PATH=$normalized_path" >> "$GITHUB_ENV"

      - name: Notarize and staple final DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$FILAMENT_MANAGER_DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$FILAMENT_MANAGER_DMG_PATH"
          xcrun stapler validate "$FILAMENT_MANAGER_DMG_PATH"

      - name: Verify signed release
        env:
          EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npm run verify:macos-release -- "$FILAMENT_MANAGER_DMG_PATH" --architectures=arm64

      - name: Write DMG checksum
        run: |
          set -euo pipefail
          dmg_directory="$(dirname "$FILAMENT_MANAGER_DMG_PATH")"
          dmg_name="$(basename "$FILAMENT_MANAGER_DMG_PATH")"
          cd "$dmg_directory"
          shasum -a 256 "$dmg_name" > SHA256SUMS.txt

      - name: Upload verified DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-macos-dmg-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/filament-manager-target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/filament-manager-target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Download release DMG candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-macos-dmg-${{ github.run_id }}
          path: ${{ runner.temp }}/filament-manager-macos-release-candidate

      - name: Verify downloaded DMG candidate
        run: |
          set -euo pipefail
          candidate_directory="$RUNNER_TEMP/filament-manager-macos-release-candidate"
          shopt -s nullglob
          candidate_dmgs=("$candidate_directory"/*.dmg)
          if [[ ${#candidate_dmgs[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded release DMG, found ${#candidate_dmgs[@]}."
            exit 1
          fi
          if [[ ! -f "$candidate_directory/SHA256SUMS.txt" ]]; then
            echo "::error::The downloaded release DMG checksum manifest is missing."
            exit 1
          fi
          (
            cd "$candidate_directory"
            shasum -a 256 --check SHA256SUMS.txt
          )
          echo "FILAMENT_MANAGER_DMG_SMOKE_PATH=${candidate_dmgs[0]}" >> "$GITHUB_ENV"

      - name: Exercise installed signed application from downloaded artifact
        env:
          EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FILAMENT_MANAGER_MACOS_SMOKE_LOG_DIR: ${{ runner.temp }}/filament-manager-macos-dmg-smoke
        run: >-
          npm run smoke:macos-dmg --
          "$FILAMENT_MANAGER_DMG_SMOKE_PATH"
          --log-dir="$FILAMENT_MANAGER_MACOS_SMOKE_LOG_DIR"
          --expected-team-id="$EXPECTED_APPLE_TEAM_ID"
          --launch-timeout-ms=120000
          --signature-policy=release

      - name: Upload installed macOS smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-macos-dmg-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/filament-manager-macos-dmg-smoke
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

      - name: Remove Apple credentials
        if: always()
        run: |
          security delete-keychain "$FILAMENT_MANAGER_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$FILAMENT_MANAGER_CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

  build-windows-msi:
    name: Build Windows MSI
    needs: validate-release
    if: github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm --prefix ./ui ci

      - name: Prepare MSI version override
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
        run: node ./scripts/normalize-msi-version.mjs --output "$env:MSI_VERSION_CONFIG_PATH"

      - name: Verify MSI preparation leaves manifests unchanged
        run: git diff --exit-code -- src-tauri/tauri.conf.json src-tauri/Cargo.toml

      - name: Build MSI bundle
        env:
          FILAMENT_MANAGER_UPDATE_METADATA_URL: ${{ vars.FILAMENT_MANAGER_UPDATE_METADATA_URL }}
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
        run: npm run tauri -- build --bundles msi --config "$env:MSI_VERSION_CONFIG_PATH"

      - name: Verify MSI bundle and write checksum
        shell: pwsh
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
        run: |
          $tauriConfig = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $msiVersionConfig = Get-Content -LiteralPath $env:MSI_VERSION_CONFIG_PATH -Raw | ConvertFrom-Json
          ./scripts/verify-windows-msi.ps1 `
            -MsiDirectory "target/release/bundle/msi" `
            -ExpectedProductName $tauriConfig.productName `
            -ExpectedProductVersion $msiVersionConfig.bundle.windows.wix.version `
            -ExpectedArchitecture "x64" `
            -NormalizedFileName "Filament-Manager_$($tauriConfig.version)_x64_en-US.msi"

      - name: Upload verified MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-windows-msi-${{ github.run_id }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/SHA256SUMS-windows.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Download release MSI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-windows-msi-${{ github.run_id }}
          path: ${{ runner.temp }}/filament-manager-windows-release-candidate

      - name: Verify downloaded MSI candidate
        shell: pwsh
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
          WINDOWS_MSI_CANDIDATE_DIR: ${{ runner.temp }}/filament-manager-windows-release-candidate
        run: |
          $tauriConfig = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $msiVersionConfig = Get-Content -LiteralPath $env:MSI_VERSION_CONFIG_PATH -Raw | ConvertFrom-Json
          $manifestPath = Join-Path $env:WINDOWS_MSI_CANDIDATE_DIR "SHA256SUMS-windows.txt"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "The downloaded release MSI checksum manifest is missing."
          }
          $expectedManifest = (Get-Content -LiteralPath $manifestPath -Raw).Trim()
          $manifestMatch = [regex]::Match(
            $expectedManifest,
            "^(?<hash>[0-9a-fA-F]{64})\s+\*?(?<file>[^\r\n]+)$"
          )
          if (-not $manifestMatch.Success) {
            throw "The downloaded release MSI checksum manifest is malformed."
          }
          $candidateFileName = $manifestMatch.Groups["file"].Value
          if ([IO.Path]::GetFileName($candidateFileName) -ne $candidateFileName) {
            throw "The downloaded release MSI checksum manifest must name a file, not a path."
          }
          $candidatePath = Join-Path $env:WINDOWS_MSI_CANDIDATE_DIR $candidateFileName
          if (-not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
            throw "The MSI named by the downloaded checksum manifest is missing."
          }
          $actualHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash
          $expectedHash = $manifestMatch.Groups["hash"].Value
          if (-not [string]::Equals($actualHash, $expectedHash, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The downloaded release MSI checksum does not match."
          }

          ./scripts/verify-windows-msi.ps1 `
            -MsiDirectory $env:WINDOWS_MSI_CANDIDATE_DIR `
            -ExpectedProductName $tauriConfig.productName `
            -ExpectedProductVersion $msiVersionConfig.bundle.windows.wix.version `
            -ExpectedArchitecture "x64" `
            -NormalizedFileName "Filament-Manager_$($tauriConfig.version)_x64_en-US.msi"

      - name: Exercise release MSI installation from downloaded artifact
        shell: pwsh
        env:
          WINDOWS_MSI_CANDIDATE_DIR: ${{ runner.temp }}/filament-manager-windows-release-candidate
          WINDOWS_MSI_SMOKE_LOG_DIR: ${{ runner.temp }}/filament-manager-windows-release-msi-smoke
        run: |
          $tauriConfig = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $msiFiles = @(Get-ChildItem -LiteralPath $env:WINDOWS_MSI_CANDIDATE_DIR -Filter "*.msi" -File)
          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one downloaded release MSI; found $($msiFiles.Count)."
          }

          ./scripts/smoke-windows-msi.ps1 `
            -MsiPath $msiFiles[0].FullName `
            -ExpectedProductName $tauriConfig.productName `
            -ExpectedExecutableName "bambu-filament-manager.exe" `
            -ExpectedWindowTitles @($tauriConfig.productName, "Dashboard") `
            -ExpectedInstallDirectory (Join-Path $env:LOCALAPPDATA $tauriConfig.productName) `
            -ExpectedAppDataDirectory (Join-Path $env:LOCALAPPDATA $tauriConfig.identifier) `
            -ExpectedDatabaseName "filament-manager.db" `
            -LogDirectory $env:WINDOWS_MSI_SMOKE_LOG_DIR `
            -SignaturePolicy "UnsignedRequired" `
            -LaunchTimeoutSeconds 120

      - name: Upload release MSI smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-windows-release-msi-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/filament-manager-windows-release-msi-smoke
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  generate-release-sbom:
    name: Generate source dependency SBOM
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare SBOM output
        id: sbom-output
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          sbom_name="Filament-Manager_${package_version}_source.spdx.json"
          mkdir -p release-metadata
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "sbom-path=release-metadata/$sbom_name" >> "$GITHUB_OUTPUT"

      - name: Generate pinned source dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps['sbom-output'].outputs['sbom-path'] }}
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate source dependency SBOM
        run: >-
          node ./scripts/verify-release-sbom.mjs
          "${{ steps['sbom-output'].outputs['sbom-path'] }}"
          --expected-package=bambu-filament-manager
          --expected-version="${{ steps['sbom-output'].outputs['package-version'] }}"

      - name: Write SBOM checksum
        env:
          SBOM_PATH: ${{ steps['sbom-output'].outputs['sbom-path'] }}
        run: |
          set -euo pipefail
          sbom_directory="$(dirname "$SBOM_PATH")"
          sbom_name="$(basename "$SBOM_PATH")"
          cd "$sbom_directory"
          sha256sum "$sbom_name" > SHA256SUMS-sbom.txt

      - name: Upload verified source dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-release-sbom-${{ github.run_id }}
          path: |
            release-metadata/*.spdx.json
            release-metadata/SHA256SUMS-sbom.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  attest-public-release:
    name: Attest public release installers
    needs:
      - validate-release
      - build-macos-dmg
      - build-windows-msi
      - generate-release-sbom
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.ref == format('refs/tags/{0}', needs['validate-release'].outputs['release-tag']) &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified macOS artifact for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-macos-dmg-${{ github.run_id }}
          path: attestation-subjects/macos

      - name: Download verified Windows artifact for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-windows-msi-${{ github.run_id }}
          path: attestation-subjects/windows

      - name: Reverify installer subjects
        id: installer-subjects
        run: |
          set -euo pipefail
          mapfile -t dmgs < <(find attestation-subjects/macos -maxdepth 1 -type f -name '*.dmg' -print)
          mapfile -t msis < <(find attestation-subjects/windows -maxdepth 1 -type f -name '*.msi' -print)
          if [[ ${#dmgs[@]} -ne 1 || ${#msis[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified DMG and one verified MSI for attestation."
            exit 1
          fi

          macos_manifest="attestation-subjects/macos/SHA256SUMS.txt"
          windows_manifest="attestation-subjects/windows/SHA256SUMS-windows.txt"
          if [[ ! -f "$macos_manifest" || ! -f "$windows_manifest" ]]; then
            echo "::error::Installer checksum manifests are required before attestation."
            exit 1
          fi
          if [[ $(grep -cve '^[[:space:]]*$' "$macos_manifest") -ne 1 \
            || $(grep -cve '^[[:space:]]*$' "$windows_manifest") -ne 1 ]]; then
            echo "::error::Each installer checksum manifest must describe exactly one artifact."
            exit 1
          fi

          (cd attestation-subjects/macos && sha256sum --check SHA256SUMS.txt)
          (cd attestation-subjects/windows && sha256sum --check SHA256SUMS-windows.txt)
          echo "dmg-path=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          echo "msi-path=${msis[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate signed build provenance
        id: installer-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps['installer-subjects'].outputs['dmg-path'] }}
            ${{ steps['installer-subjects'].outputs['msi-path'] }}

      - name: Normalize signed provenance bundle
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps['installer-provenance'].outputs['bundle-path'] }}
        run: |
          set -euo pipefail
          if [[ ! -s "$ATTESTATION_BUNDLE_PATH" ]]; then
            echo "::error::The signed provenance bundle is missing or empty."
            exit 1
          fi
          package_version="${GITHUB_REF_NAME#v}"
          mkdir -p release-provenance
          cp -- \
            "$ATTESTATION_BUNDLE_PATH" \
            "release-provenance/Filament-Manager_${package_version}_provenance.sigstore.json"

      - name: Upload signed provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-manager-release-provenance-${{ github.run_id }}
          path: release-provenance/*.sigstore.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish-github-release:
    name: Publish verified GitHub release
    needs:
      - validate-release
      - build-macos-dmg
      - build-windows-msi
      - generate-release-sbom
      - attest-public-release
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.ref == format('refs/tags/{0}', needs['validate-release'].outputs['release-tag']) &&
      needs['validate-release'].result == 'success' &&
      needs['build-macos-dmg'].result == 'success' &&
      needs['build-windows-msi'].result == 'success' &&
      needs['generate-release-sbom'].result == 'success' &&
      (
        (github.event.repository.private == false && needs['attest-public-release'].result == 'success') ||
        (github.event.repository.private == true && needs['attest-public-release'].result == 'skipped')
      )
    environment: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: write
    steps:
      - name: Require successful CI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_checks=("macOS Smoke" "Windows Smoke")

          for check_name in "${required_checks[@]}"; do
            check_runs="$(
              gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                -f check_name="$check_name" \
                -f filter=latest \
                -F per_page=100
            )"
            check_state="$(
              jq -r --arg check_name "$check_name" '
                [
                  .check_runs[]
                  | select(
                      .name == $check_name
                      and .app.slug == "github-actions"
                    )
                ]
                | sort_by([(.started_at // .created_at // ""), .id])
                | if length == 0 then
                    "missing"
                  else
                    (last | "\(.status):\(.conclusion // "pending")")
                  end
              ' <<< "$check_runs"
            )"

            if [[ "$check_state" != "completed:success" ]]; then
              echo "::error::Required CI check '$check_name' for $GITHUB_SHA is $check_state, not completed:success."
              exit 1
            fi
          done

      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-macos-dmg-${{ github.run_id }}
          path: release-assets/macos

      - name: Download verified Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-windows-msi-${{ github.run_id }}
          path: release-assets/windows

      - name: Download verified source dependency SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-release-sbom-${{ github.run_id }}
          path: release-assets/sbom

      - name: Download signed public provenance
        if: github.event.repository.private == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-release-provenance-${{ github.run_id }}
          path: release-assets/provenance

      - name: Assemble and verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          notes_path="RELEASE_NOTES_v${package_version}.md"
          if [[ "$RELEASE_TAG" != "v$package_version" || ! -f "$notes_path" ]]; then
            echo "::error::Release tag, package version and release notes must match."
            exit 1
          fi

          mapfile -t dmgs < <(find release-assets/macos -maxdepth 1 -type f -name '*.dmg' -print)
          mapfile -t msis < <(find release-assets/windows -maxdepth 1 -type f -name '*.msi' -print)
          mapfile -t sboms < <(find release-assets/sbom -maxdepth 1 -type f -name '*.spdx.json' -print)
          if [[ ${#dmgs[@]} -ne 1 || ${#msis[@]} -ne 1 || ${#sboms[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified DMG, MSI and source dependency SBOM."
            exit 1
          fi

          macos_manifest="release-assets/macos/SHA256SUMS.txt"
          windows_manifest="release-assets/windows/SHA256SUMS-windows.txt"
          sbom_manifest="release-assets/sbom/SHA256SUMS-sbom.txt"
          if [[ ! -f "$macos_manifest" || ! -f "$windows_manifest" || ! -f "$sbom_manifest" ]]; then
            echo "::error::Installer and SBOM checksum manifests are required."
            exit 1
          fi
          if [[ $(grep -cve '^[[:space:]]*$' "$macos_manifest") -ne 1 \
            || $(grep -cve '^[[:space:]]*$' "$windows_manifest") -ne 1 \
            || $(grep -cve '^[[:space:]]*$' "$sbom_manifest") -ne 1 ]]; then
            echo "::error::Each checksum manifest must describe exactly one artifact."
            exit 1
          fi

          (cd release-assets/macos && sha256sum --check SHA256SUMS.txt)
          (cd release-assets/windows && sha256sum --check SHA256SUMS-windows.txt)
          (cd release-assets/sbom && sha256sum --check SHA256SUMS-sbom.txt)
          node ./scripts/verify-release-sbom.mjs \
            "${sboms[0]}" \
            --expected-package=bambu-filament-manager \
            --expected-version="$package_version"

          provenance_assets=()
          if [[ "$REPOSITORY_PRIVATE" == "false" ]]; then
            mapfile -t provenance_assets < <(
              find release-assets/provenance -maxdepth 1 -type f -name '*.sigstore.json' -print
            )
            if [[ ${#provenance_assets[@]} -ne 1 || ! -s "${provenance_assets[0]}" ]]; then
              echo "::error::A public release requires exactly one non-empty signed provenance bundle."
              exit 1
            fi
          fi

          publish_dir="$RUNNER_TEMP/filament-manager-release-assets"
          mkdir -p "$publish_dir"
          cp -- \
            "${dmgs[0]}" \
            "${msis[0]}" \
            "${sboms[0]}" \
            "$macos_manifest" \
            "$windows_manifest" \
            "$sbom_manifest" \
            "${provenance_assets[@]}" \
            "$publish_dir/"
          echo "FILAMENT_MANAGER_RELEASE_ASSET_DIR=$publish_dir" >> "$GITHUB_ENV"
          echo "FILAMENT_MANAGER_RELEASE_NOTES_PATH=$notes_path" >> "$GITHUB_ENV"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
              --jq .sha
          )"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME no longer points to workflow commit $GITHUB_SHA."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$FILAMENT_MANAGER_RELEASE_ASSET_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Filament Manager $GITHUB_REF_NAME" \
            --notes-file "$FILAMENT_MANAGER_RELEASE_NOTES_PATH"
