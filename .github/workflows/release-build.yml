name: Release Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Select which installer artifacts to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - macos
      confirm_macos_notarization:
        description: "Allow a manual macOS build to upload to Apple for notarization"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate version and release source
        env:
          CONFIRM_MACOS_NOTARIZATION: ${{ inputs.confirm_macos_notarization }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          npm run check:version

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
            && "$SELECTED_PLATFORM" != "windows" \
            && "$CONFIRM_MACOS_NOTARIZATION" != "true" ]]; then
            echo "::error::Manual macOS release builds require notarization confirmation."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version="$(node -p "require('./package.json').version")"
            if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package version v$package_version."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Release tag $GITHUB_REF_NAME must point to a commit on main."
              exit 1
            fi
          fi

  build-macos-dmg:
    name: Build signed macOS DMG
    needs: validate-release
    if: github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'macos'
    uses: ./.github/workflows/macos-signed-release.yml
    with:
      confirm_notarization: true

  build-windows-msi:
    name: Build Windows MSI
    needs: validate-release
    if: github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ./ui ci

      - name: Normalize prerelease version for MSI
        shell: bash
        run: |
          set -euo pipefail
          raw_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$raw_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            raw_version="$(node -p "require('./package.json').version")"
          fi
          msi_version="$raw_version"
          if [[ "$raw_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-[A-Za-z0-9.-]*\.([0-9]+)$ ]]; then
            msi_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-${BASH_REMATCH[4]}"
          elif [[ "$raw_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-[A-Za-z0-9.-]+$ ]]; then
            msi_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-1"
          fi
          echo "Using MSI bundle version: $msi_version"
          node - "$msi_version" <<'NODE'
          const fs = require("node:fs");
          const version = process.argv[2];
          const tauriConfigPath = "src-tauri/tauri.conf.json";
          const cargoTomlPath = "src-tauri/Cargo.toml";
          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, "utf8"));
          tauriConfig.version = version;
          fs.writeFileSync(tauriConfigPath, `${JSON.stringify(tauriConfig, null, 2)}\n`);
          const cargoToml = fs.readFileSync(cargoTomlPath, "utf8").replace(
            /^version = ".*"$/m,
            `version = "${version}"`,
          );
          fs.writeFileSync(cargoTomlPath, cargoToml);
          NODE

      - name: Build MSI bundle
        run: npm run tauri -- build --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filament-manager-windows-msi-${{ github.ref_name }}
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
