name: Release Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Select which installer artifacts to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - macos
      confirm_macos_notarization:
        description: "Allow a manual macOS build to upload to Apple for notarization"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate version and release source
        env:
          CONFIRM_MACOS_NOTARIZATION: ${{ inputs.confirm_macos_notarization }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          npm run check:version
          npm run check:path-portability
          npm run check:command-portability
          node --test ./scripts/release-workflow-contract.test.mjs

          if [[ "$GITHUB_EVENT_NAME" == "push" \
            || "$SELECTED_PLATFORM" == "windows" \
            || "$SELECTED_PLATFORM" == "both" ]]; then
            npm run check:msi-version
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
            && "$SELECTED_PLATFORM" != "windows" \
            && "$CONFIRM_MACOS_NOTARIZATION" != "true" ]]; then
            echo "::error::Manual macOS release builds require notarization confirmation."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version="$(node -p "require('./package.json').version")"
            if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package version v$package_version."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Release tag $GITHUB_REF_NAME must point to a commit on main."
              exit 1
            fi
          fi

  build-macos-dmg:
    name: Build signed macOS DMG
    needs: validate-release
    if: github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'macos'
    environment: macos-release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Configure temporary release paths
        run: |
          set -euo pipefail
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/filament-manager-target"
            echo "FILAMENT_MANAGER_CERTIFICATE_PATH=$RUNNER_TEMP/developer-id-application.p12"
            echo "FILAMENT_MANAGER_KEYCHAIN_PATH=$RUNNER_TEMP/filament-manager-signing.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Record build environment
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ./ui ci

      - name: Validate release version
        run: |
          set -euo pipefail
          npm run check:version
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$package_version."
            exit 1
          fi

      - name: Prepare Apple credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          required_secrets=(
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_PRIVATE_KEY
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
          )
          for name in "${required_secrets[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required macos-release secret: $name"
              exit 1
            fi
          done

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$FILAMENT_MANAGER_CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$FILAMENT_MANAGER_CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security import "$FILAMENT_MANAGER_CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security list-keychains -d user -s "$FILAMENT_MANAGER_KEYCHAIN_PATH"
          security default-keychain -d user -s "$FILAMENT_MANAGER_KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$FILAMENT_MANAGER_KEYCHAIN_PATH" \
            | grep -Fq "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::The configured Developer ID Application identity was not imported."
            exit 1
          fi

      - name: Build signed and notarized DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FILAMENT_MANAGER_REQUIRE_MACOS_SIGNING: "1"
        run: npm run tauri -- build --bundles dmg

      - name: Normalize DMG filename
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$CARGO_TARGET_DIR"/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one signed DMG, found ${#dmgs[@]}."
            exit 1
          fi

          original_path="${dmgs[0]}"
          original_name="$(basename "$original_path")"
          normalized_name="${original_name// /-}"
          normalized_path="$(dirname "$original_path")/$normalized_name"
          if [[ "$original_path" != "$normalized_path" ]]; then
            mv "$original_path" "$normalized_path"
          fi
          echo "FILAMENT_MANAGER_DMG_PATH=$normalized_path" >> "$GITHUB_ENV"

      - name: Notarize and staple final DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$FILAMENT_MANAGER_DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$FILAMENT_MANAGER_DMG_PATH"
          xcrun stapler validate "$FILAMENT_MANAGER_DMG_PATH"

      - name: Verify signed release
        env:
          EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npm run verify:macos-release -- "$FILAMENT_MANAGER_DMG_PATH" --architectures=arm64

      - name: Write DMG checksum
        run: |
          set -euo pipefail
          dmg_directory="$(dirname "$FILAMENT_MANAGER_DMG_PATH")"
          dmg_name="$(basename "$FILAMENT_MANAGER_DMG_PATH")"
          cd "$dmg_directory"
          shasum -a 256 "$dmg_name" > SHA256SUMS.txt

      - name: Upload verified DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filament-manager-macos-dmg-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/filament-manager-target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/filament-manager-target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Remove Apple credentials
        if: always()
        run: |
          security delete-keychain "$FILAMENT_MANAGER_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$FILAMENT_MANAGER_CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

  build-windows-msi:
    name: Build Windows MSI
    needs: validate-release
    if: github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm --prefix ./ui ci

      - name: Prepare MSI version override
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
        run: node ./scripts/normalize-msi-version.mjs --output "$env:MSI_VERSION_CONFIG_PATH"

      - name: Verify MSI preparation leaves manifests unchanged
        run: git diff --exit-code -- src-tauri/tauri.conf.json src-tauri/Cargo.toml

      - name: Build MSI bundle
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
        run: npm run tauri -- build --bundles msi --config "$env:MSI_VERSION_CONFIG_PATH"

      - name: Verify MSI bundle and write checksum
        shell: pwsh
        env:
          MSI_VERSION_CONFIG_PATH: ${{ runner.temp }}/filament-manager-msi-version.json
        run: |
          $tauriConfig = Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $msiVersionConfig = Get-Content -LiteralPath $env:MSI_VERSION_CONFIG_PATH -Raw | ConvertFrom-Json
          ./scripts/verify-windows-msi.ps1 `
            -MsiDirectory "target/release/bundle/msi" `
            -ExpectedProductName $tauriConfig.productName `
            -ExpectedProductVersion $msiVersionConfig.bundle.windows.wix.version `
            -ExpectedArchitecture "x64"

      - name: Upload verified MSI artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filament-manager-windows-msi-${{ github.run_id }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/SHA256SUMS-windows.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish-github-release:
    name: Publish verified GitHub release
    needs:
      - validate-release
      - build-macos-dmg
      - build-windows-msi
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: write
    steps:
      - name: Require successful CI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_checks=("macOS Smoke" "Windows Smoke")

          for check_name in "${required_checks[@]}"; do
            check_runs="$(
              gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                -f check_name="$check_name" \
                -f filter=latest \
                -F per_page=100
            )"
            check_state="$(
              jq -r --arg check_name "$check_name" '
                [
                  .check_runs[]
                  | select(
                      .name == $check_name
                      and .app.slug == "github-actions"
                    )
                ]
                | sort_by([(.started_at // .created_at // ""), .id])
                | if length == 0 then
                    "missing"
                  else
                    (last | "\(.status):\(.conclusion // "pending")")
                  end
              ' <<< "$check_runs"
            )"

            if [[ "$check_state" != "completed:success" ]]; then
              echo "::error::Required CI check '$check_name' for $GITHUB_SHA is $check_state, not completed:success."
              exit 1
            fi
          done

      - name: Checkout release notes
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download verified macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-macos-dmg-${{ github.run_id }}
          path: release-assets/macos

      - name: Download verified Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filament-manager-windows-msi-${{ github.run_id }}
          path: release-assets/windows

      - name: Assemble and verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          notes_path="RELEASE_NOTES_v${package_version}.md"
          if [[ "$RELEASE_TAG" != "v$package_version" || ! -f "$notes_path" ]]; then
            echo "::error::Release tag, package version and release notes must match."
            exit 1
          fi

          mapfile -t dmgs < <(find release-assets/macos -maxdepth 1 -type f -name '*.dmg' -print)
          mapfile -t msis < <(find release-assets/windows -maxdepth 1 -type f -name '*.msi' -print)
          if [[ ${#dmgs[@]} -ne 1 || ${#msis[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified DMG and one verified MSI."
            exit 1
          fi

          macos_manifest="release-assets/macos/SHA256SUMS.txt"
          windows_manifest="release-assets/windows/SHA256SUMS-windows.txt"
          if [[ ! -f "$macos_manifest" || ! -f "$windows_manifest" ]]; then
            echo "::error::Both platform checksum manifests are required."
            exit 1
          fi
          if [[ $(grep -cve '^[[:space:]]*$' "$macos_manifest") -ne 1 \
            || $(grep -cve '^[[:space:]]*$' "$windows_manifest") -ne 1 ]]; then
            echo "::error::Each checksum manifest must describe exactly one artifact."
            exit 1
          fi

          (cd release-assets/macos && sha256sum --check SHA256SUMS.txt)
          (cd release-assets/windows && sha256sum --check SHA256SUMS-windows.txt)

          publish_dir="$RUNNER_TEMP/filament-manager-release-assets"
          mkdir -p "$publish_dir"
          cp -- "${dmgs[0]}" "${msis[0]}" "$macos_manifest" "$windows_manifest" "$publish_dir/"
          echo "FILAMENT_MANAGER_RELEASE_ASSET_DIR=$publish_dir" >> "$GITHUB_ENV"
          echo "FILAMENT_MANAGER_RELEASE_NOTES_PATH=$notes_path" >> "$GITHUB_ENV"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$FILAMENT_MANAGER_RELEASE_ASSET_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Filament Manager $GITHUB_REF_NAME" \
            --notes-file "$FILAMENT_MANAGER_RELEASE_NOTES_PATH"
