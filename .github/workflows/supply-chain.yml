name: Scheduled supply-chain audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/supply-chain.yml"
      - ".nvmrc"
      - "Cargo.lock"
      - "Cargo.toml"
      - "config/dependency-license-policy.json"
      - "deny.toml"
      - "package-lock.json"
      - "package.json"
      - "rust-toolchain.toml"
      - "scripts/check-npm-licenses.mjs"
      - "scripts/release-workflow-contract.test.mjs"
      - "scripts/rust-toolchain-contract.test.mjs"
      - "scripts/supply-chain-workflow-contract.test.mjs"
      - "src-tauri/Cargo.toml"
      - "ui/package-lock.json"
      - "ui/package.json"
  schedule:
    - cron: "27 4 * * 2"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm vulnerabilities and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enforce npm dependency license policy
        run: npm run check:npm-licenses

      - name: Audit root npm lockfile
        run: npm audit --audit-level=moderate --package-lock-only

      - name: Audit UI npm lockfile
        run: npm --prefix ./ui audit --audit-level=moderate --package-lock-only

  cargo-audit:
    name: Cargo vulnerabilities and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Install pinned cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit Cargo lockfile
        run: cargo audit

      - name: Install pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Enforce Cargo dependency license policy
        run: cargo deny --all-features check licenses

  sbom-smoke:
    name: SBOM generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare SBOM output
        run: mkdir -p release-metadata

      - name: Generate pinned source dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-metadata/dependency-smoke.spdx.json
          syft-version: v1.51.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate source dependency SBOM
        run: >-
          node ./scripts/verify-release-sbom.mjs
          release-metadata/dependency-smoke.spdx.json
          --expected-package=bambu-filament-manager
          --expected-version="$(node -p "require('./package.json').version")"
