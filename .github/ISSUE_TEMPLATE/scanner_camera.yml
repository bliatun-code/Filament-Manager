name: Scanner or camera issue
description: Report a problem with Bambu code, barcode, image import, or webcam scanning.
title: "[Scanner]: "
labels:
  - bug
  - scanner
body:
  - type: markdown
    attributes:
      value: |
        Please remove private LAN addresses, pairing tokens, full QR targets, names, and inventory details before submitting. A redacted label image is usually enough to reproduce scanner behavior.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.21.2"
    validations:
      required: true
  - type: dropdown
    id: scan_mode
    attributes:
      label: Scan mode
      options:
        - Manual code entry
        - Image import
        - Webcam scanning
        - Keyboard barcode scanner
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS desktop
        - Windows desktop
        - Browser/client
        - Companion
    validations:
      required: true
  - type: textarea
    id: label_details
    attributes:
      label: Label or box details
      description: Filament material/color/code, sanitized barcode format, or SKU. Do not paste a full Companion or pairing URL, token, private IP address, or QR payload.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include whether the camera preview worked, whether anything was detected, and what feedback was shown.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or sample images
      description: Attach images only after removing private data, pairing links, full RFID values, and unrelated inventory details.
