[package]
name = "bambu-filament-manager"
version = "0.27.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[dependencies]
filament-manager-core = { path = ".." }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
open = { version = "5.4.0", features = ["shellexecute-on-windows"] }
reqwest = { workspace = true }
rand = { workspace = true }
if-addrs = "0.15.0"
sha2 = "0.11.0"
qrcode = "0.14.1"
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
native-tls = "0.2.18"
x509-parser = { version = "0.18.1", default-features = false }
time = { workspace = true }
url = "2.5.8"
flate2 = "1.1.9"
semver = "1.0.28"
zeroize = "1.9.0"
socket2 = "0.6.5"
mdns-sd = "0.21.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2.5.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }
winreg = "0.55.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
filament-manager-core = { path = "..", features = ["test-support"] }
tower = "0.5.3"
