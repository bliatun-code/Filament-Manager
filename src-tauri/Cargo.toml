[package]
name = "bambu-filament-manager"
version = "0.21.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
open = "5.3.6"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rand = "0.10.2"
if-addrs = "0.15.0"
sha2 = "0.11.0"
qrcode = "0.14.1"
base64 = "0.22.1"
native-tls = "0.2.18"
time = { version = "0.3.53", features = ["parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tower = "0.5.3"
