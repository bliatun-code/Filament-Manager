<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filament Manager Companion</title>
    <link
      id="companion-favicon"
      rel="icon"
      type="image/png"
      href="/companion/icon-light.png"
      sizes="any"
    />
    <link
      id="companion-apple-touch-icon"
      rel="apple-touch-icon"
      href="/companion/icon-light.png"
    />
    <link rel="stylesheet" href="/companion/app.css" />
    <link rel="stylesheet" href="/companion/workspace.css" />
  </head>
  <body>
    <div id="app"></div>
    <div
      id="companion-live-region-polite"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div
      id="companion-live-region-assertive"
      class="sr-only"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    ></div>
    <script type="module" src="/companion/app.js"></script>
  </body>
</html>
